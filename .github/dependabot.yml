# Dependabot: meldt verouderde of onveilige npm-pakketten via pull requests.
# Kleine updates worden gebundeld zodat er niet elke week tien losse PR's komen.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Grote versiesprongen (bijv. vite 6 -> 8) breken vaak de build: die doen we bewust handmatig
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
