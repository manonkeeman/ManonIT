[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Privacy/Colofon zijn NL-only (geen EN-content) — /en/... was per ongeluk
# bereikbaar en indexeerbaar, wat Google als duplicate content zag
[[redirects]]
  from = "/en/privacy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/en/colofon"
  to = "/colofon"
  status = 301

# Oude FAQ-pagina en het vervallen prijsblog: doorsturen naar de tarieven op de homepage
[[redirects]]
  from = "/faq"
  to = "/#tarieven"
  status = 301

[[redirects]]
  from = "/en/faq"
  to = "/en#tarieven"
  status = 301

[[redirects]]
  from = "/journal/wat-kost-een-website"
  to = "/#tarieven"
  status = 301

[[redirects]]
  from = "/en/journal/wat-kost-een-website"
  to = "/en#tarieven"
  status = 301

# Verwijderde blogs: doorsturen naar het journal
[[redirects]]
  from = "/journal/fullstackdeveloper"
  to = "/journal"
  status = 301

[[redirects]]
  from = "/en/journal/fullstackdeveloper"
  to = "/en/journal"
  status = 301

[[redirects]]
  from = "/journal/scrummaster"
  to = "/journal"
  status = 301

[[redirects]]
  from = "/en/journal/scrummaster"
  to = "/en/journal"
  status = 301

[[redirects]]
  from = "/journal/luchtvaartfamilie2018"
  to = "/journal"
  status = 301

[[redirects]]
  from = "/en/journal/luchtvaartfamilie2018"
  to = "/en/journal"
  status = 301

# SPA fallback: geprerenderde pagina's (dist/<pad>.html) worden direct
# geserveerd; alle andere routes krijgen de onbewerkte app-shell (zie scripts/prerender.mjs)
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Long-term cache for hashed Vite assets (JS/CSS/fonts with content hash in filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images 30 days
[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/portfolio/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/portfolio/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Capital P — Linux (Netlify) is case-sensitive
[[headers]]
  for = "/Portfolio/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/Portfolio/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/Portfolio/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/Portfolio/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# OG images at root — 30 days
[[headers]]
  for = "/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/journal/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/journal/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML never cached — always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers — alle pagina's
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; frame-src 'none'; connect-src 'self' https://api.netlify.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"